name: Build Android (test APK)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never on main: a cancelled run there would skip the only cache save.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  build-android:
    runs-on: ubuntu-24.04
    # Route the NDK C++ compiler through ccache (cached across runs) — the main
    # lever for New-Arch native build time. Honored by every RN native module's
    # CMake configure (CMake reads CMAKE_<LANG>_COMPILER_LAUNCHER from the env
    # since 3.17; the NDK ships CMake 3.22+).
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      # ccache tuning so cached objects survive across ephemeral runners.
      # Without this, cross-run hit rate is 0%: the NDK clang is re-provisioned
      # each run with a fresh mtime, and ccache's default compiler_check=mtime
      # treats that as a different compiler and discards the whole cache.
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,pch_defines
    # New Arch compiles native code. Cold cache ~15-20 min; warm (ccache +
    # gradle build cache) considerably less. Cap high so a cold first build
    # doesn't trip a spurious timeout; the cap only guards genuine hangs.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # Saved from main only, after the build: a pull request saving its own
      # copy fills the 10 GB of the repository within a few pushes, which
      # evicts main's and leaves every build cold.
      - name: Restore the Gradle cache
        id: gradle-cache
        uses: ./.github/actions/restore-gradle-cache

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@dbeefd73e8e2ffc1bbc412570072735eb4db3607 # v1.2.25
        with:
          key: android-ccache-v2
          max-size: 2G
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: npm ci

      # Gradle compiles the Rust core (buildRustCore): keep its crates and rust/target.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          shared-key: rust-android
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # assembleRelease signs with the committed debug keystore (no secret) and
      # embeds the JS bundle -> standalone, installable APK. Restrict ABIs to
      # arm64 (real devices) + x86_64 (emulators) to halve build time and size.
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --build-cache -PreactNativeArchitectures=arm64-v8a,x86_64

      - name: Save the Gradle cache
        if: github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.key }}

      - name: ccache stats
        if: always()
        run: ccache -s

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "::error::No APK produced"; exit 1; fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: twake-drive-android-apk-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Comment build link on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR_NUMBER" --body \
          "📱 **Android test APK** built in [run #${RUN_NUMBER}](${RUN_URL}). Download it from the run's **Artifacts** → \`twake-drive-android-apk-${RUN_NUMBER}\`. Install with \`adb install <file>.apk\` or enable 'install from unknown sources' on the device."
