name: E2E (Android, disposable instance)

# Runs the Maestro flows against an emulator and a cozy-stack created for the
# run, so nothing touches a real account. See e2e/README.md.
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'ios/**'
      - '.github/workflows/release-*.yml'
  workflow_dispatch:
    inputs:
      flows:
        description: 'Flows or directories to run, space separated (empty: all of them; sign-in is always run first)'
        required: false
        default: ''
      seed:
        description: 'Order seed to replay, from the summary of an earlier run'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  INSTANCE_DOMAIN: alice.10-0-2-2.nip.io
  INSTANCE_PASSPHRASE: cozycozy

  # Same ccache tuning as build-android.yml, which builds the same
  # assembleRelease: without it this one took 35 minutes, with it under eleven
  # on a cold cache.
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  CCACHE_COMPILERCHECK: content
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_NOHASHDIR: 'true'
  CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,pch_defines

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Start the stack
        run: |
          docker compose -f e2e/stack/docker-compose.yml up -d
          docker compose -f e2e/stack/docker-compose.yml ps

      - name: Create the disposable instance
        run: |
          STACK_CONTAINER="$(docker compose -f e2e/stack/docker-compose.yml ps -q stack)" \
            e2e/stack/setup.sh "$INSTANCE_DOMAIN" "$INSTANCE_PASSPHRASE"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: android-ccache
          max-size: 2G

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-e2e-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-e2e-

      # A release build with the bundle inside: no Metro to serve it, no
      # development menu over the screen, and the app starts in seconds.
      # EXPO_PUBLIC_E2E opens the instance address screen, and the property
      # lets this build alone talk to the stack over plain HTTP.
      - name: Build the APK
        env:
          EXPO_PUBLIC_E2E: '1'
        run: ./gradlew assembleRelease -PusesCleartextTraffic=true --no-daemon --build-cache -PreactNativeArchitectures=x86_64
        working-directory: android

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Let the runner use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the flows
        env:
          FLOWS: ${{ inputs.flows }}
          E2E_SEED: ${{ inputs.seed }}
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb shell pm clear com.linagora.twakedrive || true
            # shellcheck disable=SC2086
            STACK_CONTAINER="$(docker compose -f e2e/stack/docker-compose.yml ps -q stack)" ./e2e/scripts/run-flows.sh $FLOWS
            # Captured, not compared: an Android baseline is committed once these are eyeballed.
            CAPTURE_ONLY=1 FLOWS=e2e/maestro/flows/01-visual-tour.yaml EXCLUDE_EXTRA=none ./e2e/scripts/run-visual.sh android || true

      # The flows that film a window where nothing is driven: anything moving in
      # one of those is the app changing its mind on its own, which no assertion
      # is fast enough to catch.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Check the recordings held still
        run: |
          if find "$HOME/.maestro/tests" -name '*.mp4' | grep -q .; then
            node e2e/scripts/check-recording.mjs --dir "$HOME/.maestro/tests"
          else
            echo "No flow of this run films anything."
          fi

      - name: Collect what the run left behind
        if: always()
        run: |
          mkdir -p /tmp/e2e-artifacts
          cp -r /tmp/maestro-reports /tmp/e2e-artifacts/ 2>/dev/null || true
          cp -r ~/.maestro/tests /tmp/e2e-artifacts/maestro-tests 2>/dev/null || true
          cp -r e2e/maestro/screenshots/current /tmp/e2e-artifacts/screenshots 2>/dev/null || true
          find "$HOME/.maestro/tests" -name '*.mp4' -exec cp {} /tmp/e2e-artifacts/ \; 2>/dev/null || true
          find "$HOME/.maestro/tests" -type d -name '*-changes' -exec cp -r {} /tmp/e2e-artifacts/ \; 2>/dev/null || true
          docker compose -f e2e/stack/docker-compose.yml logs --no-color > /tmp/e2e-artifacts/stack.log 2>&1 || true

      - name: Upload them
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-android
          path: /tmp/e2e-artifacts
          retention-days: 7
