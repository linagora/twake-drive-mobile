# The cozy-stack an end-to-end run talks to, with its CouchDB inside.
#
# The development image on purpose: a production build of the stack writes
# every URL it generates with https, which a run with no certificate cannot
# answer, and it asks for an admin passphrase on every CLI call.
#
# Published on port 80 so instance domains carry no port: the emulator reaches
# the host through 10.0.2.2, and nip.io resolves `<anything>.10-0-2-2.nip.io`
# to it.
services:
  stack:
    image: cozy/cozy-app-dev:latest
    environment:
      COZY_STACK_HOST: alice.10-0-2-2.nip.io
      COZY_STACK_PORT: '8080'
      COZY_STACK_PASS: cozycozy
    volumes:
      - ./cozy.yaml:/etc/cozy/cozy.yaml:ro
    ports:
      - '80:8080'
      - '5984:5984'
      - '6060:6060'
  # The sign-up portal a logout visits, see portal.js. The emulator reaches it
  # through 10.0.2.2 like the stack.
  portal:
    image: node:20-alpine
    command: ['node', '/portal.js']
    volumes:
      - ./portal.js:/portal.js:ro
    ports:
      - '8090:8090'
