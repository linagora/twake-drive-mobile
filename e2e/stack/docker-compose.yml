# A cozy-stack and its CouchDB, for end-to-end runs against a disposable
# instance. Published on port 80 so instance domains carry no port: the
# emulator reaches the host through 10.0.2.2, and nip.io resolves
# `<anything>.10-0-2-2.nip.io` to it.
services:
  couchdb:
    image: couchdb:3
    environment:
      COUCHDB_USER: cozy
      COUCHDB_PASSWORD: cozy
    ports:
      - '5984:5984'

  stack:
    image: cozy/cozy-stack:latest
    depends_on:
      - couchdb
    environment:
      # Read by the image's entrypoint, which waits for CouchDB, creates its
      # system databases and writes the admin passphrase file on first start.
      COUCHDB_HOST: couchdb
      COUCHDB_PORT: '5984'
      COUCHDB_USER: cozy
      COUCHDB_PASSWORD: cozy
      COZY_ADMIN_PASSPHRASE: cozyadmin
      # Read by the stack itself.
      COZY_HOST: 0.0.0.0
      COZY_PORT: '8080'
      COZY_ADMIN_HOST: 0.0.0.0
      COZY_ADMIN_PORT: '6060'
      COZY_COUCHDB_URL: http://cozy:cozy@couchdb:5984/
      COZY_FS_URL: file:///var/lib/cozy
      COZY_SUBDOMAINS: flat
    ports:
      - '80:8080'
      - '6060:6060'
