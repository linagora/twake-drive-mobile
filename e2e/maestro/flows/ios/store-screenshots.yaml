appId: com.linagora.twakedrive
tags:
  - store-screenshots
---
# App Store screenshots. Read only, and not part of any e2e run: it expects a
# demo account that is already signed in, holding a few clean files, among them
# "New presentation.pptx", on a shipped build (no instance address screen).
#
# The PNGs are named for fastlane deliver (the device slot comes from the pixel
# size, the upload order from the file name). Maestro writes them, next to its
# logs, under the test output directory; only the PNGs leave it, flattened to
# drop the alpha channel the App Store refuses. Screens that show the account
# (settings, profile menu) or the instance address are never visited.
#
#   maestro --platform ios test --udid <udid> --test-output-dir "$TMP" \
#     /path/to/store-screenshots.yaml
#   find "$TMP" -path '*/takeScreenshot/*.png' -exec sh -c \
#     'magick "$1" -alpha off ios/fastlane/screenshots/<locale>/"${1##*/}"' _ {} \;
- launchApp:
    stopApp: true
- runFlow: ../../subflows/assertLoggedIn.yaml
- runFlow: ../../subflows/dismissDevWarnings.yaml
- extendedWaitUntil:
    visible:
      id: 'file-actions:New presentation.pptx'
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: 01_files-list
- tapOn:
    id: 'view-toggle'
- waitForAnimationToEnd
- takeScreenshot: 02_files-grid
- tapOn:
    id: 'view-toggle'
- tapOn:
    id: 'file-actions:New presentation.pptx'
- waitForAnimationToEnd
- takeScreenshot: 03_file-actions
- tapOn:
    point: '50%,15%'
- extendedWaitUntil:
    notVisible:
      id: 'bottom-drawer-sheet'
    timeout: 10000
- tapOn:
    id: 'tab-recent'
- waitForAnimationToEnd
- takeScreenshot: 04_recent
- tapOn:
    id: 'tab-files'
