appId: com.linagora.twakedrive
tags:
  - ios-files
---
# Twake Drive is listed in Files while a session exists and leaves it at
# sign-out. Starts signed in and ends signed out: run it last.
- launchApp
- runFlow: ../../subflows/assertLoggedIn.yaml
- runFlow: ../../subflows/dismissDevWarnings.yaml
- launchApp:
    appId: com.apple.DocumentsApp
    stopApp: true
- tapOn: 'Explorer'
- tapOn: 'Explorer'
- extendedWaitUntil:
    visible:
      text: 'Twake Drive'
      below: 'Emplacements'
    timeout: 20000
- launchApp
- runFlow: ../../subflows/dismissDevWarnings.yaml
- tapOn:
    id: 'appbar-avatar'
- tapOn: 'Se déconnecter'
- extendedWaitUntil:
    notVisible:
      id: 'drive-fab'
    timeout: 30000
- launchApp:
    appId: com.apple.DocumentsApp
    stopApp: true
- tapOn: 'Explorer'
- tapOn: 'Explorer'
- extendedWaitUntil:
    notVisible:
      text: 'Twake Drive'
      below: 'Emplacements'
    timeout: 30000
