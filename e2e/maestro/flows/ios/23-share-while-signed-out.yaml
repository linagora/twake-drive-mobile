appId: com.linagora.twakedrive
tags:
  - ios-files
---
# A picture shared to Twake Drive from Photos while signed out opens the folder
# picker once the user is back in, and a later share opens it again, with the
# app still running. Starts signed in and ends signed in.
- launchApp
- runFlow: ../../subflows/assertLoggedIn.yaml
- runFlow: ../../subflows/dismissDevWarnings.yaml
- addMedia:
    - ../../../fixtures/sample.jpg
- tapOn:
    id: 'appbar-avatar'
- tapOn:
    id: 'appbar-logout'
- tapOn:
    id: 'logout-dialog-submit'
- extendedWaitUntil:
    visible:
      id: 'welcome-login'
    timeout: 60000
- runFlow: ../../subflows/shareLastPhoto.yaml
- extendedWaitUntil:
    visible:
      id: 'welcome-dev-instance-link'
    timeout: 30000
- runFlow:
    file: ../../subflows/signInInstance.yaml
    env:
      SKIP_DRIVE_ASSERT: 'true'
- extendedWaitUntil:
    visible:
      id: 'folder-picker-confirm'
    timeout: 60000
- tapOn: 'Annuler|Cancel'
- extendedWaitUntil:
    notVisible:
      id: 'folder-picker-confirm'
    timeout: 10000
# The app keeps running behind Photos for the second share.
- runFlow: ../../subflows/shareLastPhoto.yaml
- extendedWaitUntil:
    visible:
      id: 'folder-picker-confirm'
    timeout: 60000
- tapOn: 'Annuler|Cancel'
