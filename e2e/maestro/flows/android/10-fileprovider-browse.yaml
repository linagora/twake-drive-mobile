appId: com.android.documentsui
tags:
  - android
env:
  PROVIDER_LABEL: 'Twake Drive'
onFlowComplete:
  - runFlow: ../../subflows/cleanup.yaml
---
# The DocumentsProvider lists the drive in the system file picker. Its root
# only shows while a session exists (queryRoots returns nothing without one).
- runScript:
    file: ../../scripts/seed.js
    env:
      SEED: '[{"key":"folder","kind":"folder","prefix":"E2E-saf"}]'
- launchApp:
    stopApp: true
- tapOn: 'Show roots|Afficher les racines'
- tapOn: '.*${PROVIDER_LABEL}.*'
- extendedWaitUntil:
    visible: '${output.folder.name}'
    timeout: 30000
