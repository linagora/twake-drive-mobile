appId: com.linagora.twakedrive
tags:
  - android
# The flows after this one need the session back, and a replica that has
# caught up: a flow started during the first sync of a fresh sign-in does not
# see what it seeds in time. Something seeded after the sign-in showing up says
# the sync is past it.
onFlowComplete:
  - runFlow: ../00-login-instance.yaml
  - runScript:
      file: ../../scripts/seed.js
      env:
        SEED: '[{"key":"settled","kind":"folder","prefix":"E2E-settled"}]'
  - extendedWaitUntil:
      visible:
        id: 'folder-row:${output.settled.name}'
      timeout: 180000
  - runFlow: ../../subflows/cleanup.yaml
---
# The drive leaves the system file picker at a plain sign-out (the erasing one
# runs the same provider cleanup), and what it cached for other apps goes.
- runScript:
    file: ../../scripts/seed.js
    env:
      SEED: '[{"key":"folder","kind":"folder","prefix":"E2E-saf-out"}]'
- launchApp:
    stopApp: true
- runFlow: ../../subflows/openDrive.yaml
# A picker window open on the drive root.
- launchApp:
    appId: com.android.documentsui
    stopApp: true
- tapOn: 'Show roots|Afficher les racines'
- extendedWaitUntil:
    visible: '.*Twake Drive.*'
    timeout: 30000
- tapOn: '.*Twake Drive.*'
- extendedWaitUntil:
    visible: '${output.folder.name}'
    timeout: 30000
- launchApp:
    appId: com.linagora.twakedrive
- tapOn:
    id: 'appbar-avatar'
- tapOn:
    id: 'appbar-logout'
- tapOn:
    id: 'logout-dialog-submit'
- extendedWaitUntil:
    visible:
      id: 'welcome-login'
    timeout: 60000
# The window opened before the logout does not keep listing the drive.
- launchApp:
    appId: com.android.documentsui
    stopApp: false
- extendedWaitUntil:
    visible: 'Downloads|Téléchargements'
    timeout: 20000
- assertNotVisible: '${output.folder.name}'
# A new window does not list it among the roots.
- launchApp:
    appId: com.android.documentsui
    stopApp: true
- tapOn: 'Show roots|Afficher les racines'
- extendedWaitUntil:
    visible: 'Downloads|Téléchargements'
    timeout: 20000
- assertNotVisible: '.*Twake Drive.*'
