appId: com.android.documentsui
tags:
  - android
onFlowComplete:
  - runFlow: ../../subflows/cleanup.yaml
---
# Shares an image from the system file picker to Twake Drive and imports it
# into a folder of its own. The runner pushes the image to Download
# (e2e/scripts/run-flows.sh).
- runScript:
    file: ../../scripts/seed.js
    env:
      SEED: '[{"key":"folder","kind":"folder","prefix":"E2E-import"}]'
- runFlow: ../../subflows/shareFromDocumentsUi.yaml
- extendedWaitUntil:
    visible:
      id: 'folder-picker-confirm'
    timeout: 60000
# the header says what the picker is for, not only which folder it shows
- assertVisible:
    id: 'folder-picker-title-title-text'
    text: 'Import to…|Importer dans…'
- scrollUntilVisible:
    element:
      id: 'folder-picker-row:${output.folder.name}'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'folder-picker-row:${output.folder.name}'
- waitForAnimationToEnd
- tapOn:
    id: 'folder-picker-confirm'
- extendedWaitUntil:
    notVisible:
      id: 'folder-picker-confirm'
    timeout: 60000
