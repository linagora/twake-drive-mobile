appId: com.android.documentsui
tags:
  - android
env:
  SHARED_IMAGE: 'e2e-share.jpg'
onFlowComplete:
  - runFlow: ../../subflows/cleanup.yaml
---
# Shares an image from the system file picker to Twake Drive and imports it
# into a folder of its own. The runner pushes the image to Download
# (e2e/scripts/run-ci-android.sh).
- runScript:
    file: ../../scripts/seed.js
    env:
      SEED: '[{"key":"folder","kind":"folder","prefix":"E2E-import"}]'
- launchApp:
    stopApp: true
- tapOn:
    id: 'com.android.documentsui:id/option_menu_search'
- inputText: 'e2e-share'
- pressKey: Enter
- waitForAnimationToEnd
- tapOn:
    text: 'List view|Affichage en liste'
    optional: true
- extendedWaitUntil:
    visible: '${SHARED_IMAGE}'
    timeout: 20000
# a long press starts a drag; a tap on the icon selects
- tapOn:
    id: 'com.android.documentsui:id/icon'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'Share|Partager'
    timeout: 10000
- tapOn: 'Share|Partager'
- tapOn: 'Twake Drive'
- extendedWaitUntil:
    visible:
      id: 'folder-picker-confirm'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'folder-picker-row:${output.folder.name}'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'folder-picker-row:${output.folder.name}'
- waitForAnimationToEnd
- tapOn:
    id: 'folder-picker-confirm'
- extendedWaitUntil:
    notVisible:
      id: 'folder-picker-confirm'
    timeout: 60000
