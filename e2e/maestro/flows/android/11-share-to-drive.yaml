appId: com.android.documentsui
tags:
  - android
env:
  SHARED_IMAGE: 'e2e-share.jpg'
onFlowComplete:
  - runFlow: ../../subflows/cleanup.yaml
---
# Shares an image from the system file picker to Twake Drive and imports it
# into a folder of its own. The runner pushes the image to Download
# (e2e/scripts/run-ci-android.sh).
- runScript:
    file: ../../scripts/seed.js
    env:
      SEED: '[{"key":"folder","kind":"folder","prefix":"E2E-import"}]'
- launchApp:
    stopApp: true
- tapOn: 'Show roots|Afficher les racines'
- tapOn: 'Downloads|Téléchargements'
- extendedWaitUntil:
    visible: '${SHARED_IMAGE}'
    timeout: 15000
- longPressOn: '${SHARED_IMAGE}'
- tapOn: 'Share|Partager'
- tapOn: 'Twake Drive'
- extendedWaitUntil:
    visible:
      id: 'folder-picker-confirm'
    timeout: 60000
- scrollUntilVisible:
    element:
      id: 'folder-picker-row:${output.folder.name}'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'folder-picker-row:${output.folder.name}'
- waitForAnimationToEnd
- tapOn:
    id: 'folder-picker-confirm'
- extendedWaitUntil:
    notVisible:
      id: 'folder-picker-confirm'
    timeout: 60000
