appId: com.linagora.twakedrive
tags:
  - inapp
onFlowComplete:
  - runFlow: ../../subflows/cleanup.yaml
---
# A moved file leaves the list at once and is found in the destination; the
# picker walks into folders only (#172), and back up through its own button.
- runScript:
    file: ../../scripts/seed.js
    env:
      SEED: '[{"key":"dest","kind":"folder","prefix":"E2E-dest"},{"key":"file","kind":"file","prefix":"E2E-move","ext":"txt"}]'
- runFlow: ../../subflows/openDrive.yaml
- extendedWaitUntil:
    visible:
      id: 'file-row:${output.file.name}'
    timeout: 60000

- tapOn:
    id: 'file-actions:${output.file.name}'
- waitForAnimationToEnd
- tapOn:
    id: 'action-move'
- waitForAnimationToEnd:
    timeout: 8000
- scrollUntilVisible:
    element:
      id: 'folder-picker-row:${output.dest.name}'
    direction: DOWN
    timeout: 20000
- tapOn:
    id: 'folder-picker-row:${output.dest.name}'
- waitForAnimationToEnd
- tapOn:
    id: 'folder-picker-confirm'
- extendedWaitUntil:
    notVisible:
      id: 'file-row:${output.file.name}'
    timeout: 20000

- tapOn:
    id: 'folder-row:${output.dest.name}'
- extendedWaitUntil:
    visible:
      id: 'file-row:${output.file.name}'
    timeout: 20000

- tapOn:
    id: 'file-actions:${output.file.name}'
- waitForAnimationToEnd
- tapOn:
    id: 'action-move'
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    id: 'folder-picker-up'
- waitForAnimationToEnd
- tapOn:
    id: 'folder-picker-confirm'
- extendedWaitUntil:
    notVisible:
      id: 'file-row:${output.file.name}'
    timeout: 20000
- tapOn:
    id: 'appbar-back-button'
- extendedWaitUntil:
    visible:
      id: 'file-row:${output.file.name}'
    timeout: 20000
