appId: com.linagora.twakedrive
tags:
  - inapp
env:
  FILE: 'readme.txt'
  DESTINATION: 'Documents'
---
# Move: the moved row leaves the list at once and is found inside the
# destination. The picker it goes through walks into folders only (#172).
#
# Acts on what the disposable instance seeds (e2e/stack/setup.sh): a
# `Documents` folder and a `readme.txt` file at the root. Nothing is typed —
# synthetic typing drops characters, which is what had this flow skipped.
# The file is moved back to the root at the end, so a rerun starts clean.
- runFlow: ../../subflows/openDrive.yaml
- extendedWaitUntil:
    visible: '${FILE}'
    timeout: 20000

# Root → Documents
- tapOn:
    id: 'file-actions:${FILE}'
- waitForAnimationToEnd
- tapOn:
    id: 'action-move'
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    id: 'folder-picker-row:${DESTINATION}'
- waitForAnimationToEnd
- tapOn:
    id: 'folder-picker-confirm'
# The sheet closes on its own once the move lands, and the row is gone from
# the folder it left.
- extendedWaitUntil:
    visible:
      id: 'drive-fab'
    timeout: 20000
- extendedWaitUntil:
    notVisible: '${FILE}'
    timeout: 20000

# It is inside the destination.
- tapOn:
    id: 'folder-row:${DESTINATION}'
- extendedWaitUntil:
    visible: '${FILE}'
    timeout: 20000

# Documents → root, through the picker's own way up.
- tapOn:
    id: 'file-actions:${FILE}'
- waitForAnimationToEnd
- tapOn:
    id: 'action-move'
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    id: 'folder-picker-up'
- waitForAnimationToEnd
- tapOn:
    id: 'folder-picker-confirm'
- extendedWaitUntil:
    visible:
      id: 'drive-fab'
    timeout: 20000
- extendedWaitUntil:
    notVisible: '${FILE}'
    timeout: 20000
- tapOn:
    id: 'appbar-back-button'
- extendedWaitUntil:
    visible: '${FILE}'
    timeout: 20000
