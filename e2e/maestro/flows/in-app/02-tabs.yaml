appId: com.linagora.twakedrive
tags:
  - inapp
---
# Walks every tab and comes back to Mon Drive.
- runFlow: ../../subflows/openDrive.yaml
- tapOn:
    id: 'tab-recent'
- tapOn:
    id: 'tab-favorites'
- tapOn:
    id: 'tab-trash'
- tapOn:
    id: 'tab-files'
- extendedWaitUntil:
    visible:
      id: 'tab-files'
    timeout: 8000
