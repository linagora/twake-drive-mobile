appId: com.linagora.twakedrive
tags:
  - inapp
onFlowComplete:
  - runFlow: ../../subflows/cleanup.yaml
---
# Finds a file by part of its name, from the search button of the drive.
- runScript:
    file: ../../scripts/seed.js
    env:
      SEED: '[{"key":"file","kind":"file","prefix":"Recherche","ext":"txt"}]'
- runFlow: ../../subflows/openDrive.yaml
- tapOn:
    id: 'appbar-search-button'
- extendedWaitUntil:
    visible:
      id: 'search-input'
    timeout: 20000
- tapOn:
    id: 'search-input'
- inputText: '${output.file.name.split("-")[1].split(".")[0]}'
- extendedWaitUntil:
    visible: '${output.file.name}.*'
    timeout: 30000
