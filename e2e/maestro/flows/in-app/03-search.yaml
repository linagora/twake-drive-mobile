appId: com.linagora.twakedrive
tags:
  - inapp
onFlowComplete:
  - runFlow: ../../subflows/cleanup.yaml
---
# Finds a file by part of its name. The screen has no entry point in the UI
# yet, so it is reached by its deep link.
- runScript:
    file: ../../scripts/seed.js
    env:
      SEED: '[{"key":"file","kind":"file","prefix":"Recherche","ext":"txt"}]'
- runFlow: ../../subflows/openDrive.yaml
- openLink: twakedrive:///search
- extendedWaitUntil:
    visible:
      id: 'search-input'
    timeout: 20000
- tapOn:
    id: 'search-input'
- inputText: '${output.file.name.split("-")[1].split(".")[0]}'
- extendedWaitUntil:
    visible: '${output.file.name}'
    timeout: 30000
