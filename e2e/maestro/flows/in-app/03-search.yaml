appId: com.linagora.twakedrive
tags:
  - inapp
env:
  SEARCH_QUERY: 'readme'
  SEARCH_HIT: 'readme.txt'
---
# Driven by deep link: /search has no entry point in the shipped UI (AppBar's
# showSearch renders a help button, see src/ui/AppBar.tsx). The screen and its
# useFileSearch hook work, so the flow reaches them that way.
- openLink: twakedrive:///search
- assertVisible:
    id: 'search-input'
- inputText: '${SEARCH_QUERY}'
- extendedWaitUntil:
    visible: '${SEARCH_HIT}'
    timeout: 20000
