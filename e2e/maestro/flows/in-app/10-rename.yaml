appId: com.linagora.twakedrive
tags:
  - inapp
env:
  RENAMED: 'Lqx'
onFlowComplete:
  - runFlow: ../../subflows/cleanup.yaml
---
# The row carries the new name before the server answers (#165). The new name
# is short: synthetic typing drops characters from long ones.
- runScript:
    file: ../../scripts/seed.js
    env:
      SEED: '[{"key":"folder","kind":"folder","prefix":"E2E-ren"}]'
- runFlow: ../../subflows/openDrive.yaml
- extendedWaitUntil:
    visible:
      id: 'folder-row:${output.folder.name}'
    timeout: 60000
- tapOn:
    id: 'folder-actions:${output.folder.name}'
- waitForAnimationToEnd
- tapOn:
    id: 'action-rename'
- waitForAnimationToEnd
- tapOn:
    id: 'rename-name-input'
- eraseText
- inputText: '${RENAMED}y'
# One Backspace takes one character (#494), not two.
- pressKey: Backspace
- assertVisible:
    id: 'rename-name-input'
    text: '${RENAMED}'
- tapOn:
    id: 'rename-submit'
- extendedWaitUntil:
    visible:
      id: 'folder-row:${RENAMED}'
    timeout: 15000
- assertNotVisible:
    id: 'folder-row:${output.folder.name}'
