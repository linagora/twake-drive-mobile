appId: com.linagora.twakedrive
tags:
  - inapp
# The flows after this one need the session back, whether it passed or not.
onFlowComplete:
  - runFlow: ../00-login-instance.yaml
  - runFlow: ../../subflows/cleanup.yaml
---
# A drawing opens in its web editor, in a browser tab, and the app is killed
# while that tab is still open. Signing out after the app comes back has to
# open the portal's logout page, not bring back the old tab: the browser task
# the app left behind is reused for every page the app opens.
- runScript:
    file: ../../scripts/seed.js
    env:
      SEED: '[{"key":"file","kind":"file","prefix":"E2E-croquis","ext":"excalidraw","content":"{}","mime":"application/vnd.excalidraw+json"}]'
- runFlow: ../../subflows/openDrive.yaml
- extendedWaitUntil:
    visible:
      id: 'file-row:${output.file.name}'
    timeout: 60000
- tapOn:
    id: 'file-row:${output.file.name}'
- extendedWaitUntil:
    notVisible:
      id: 'file-row:${output.file.name}'
    timeout: 15000
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: 'file-row:${output.file.name}'
    timeout: 60000
- runScript:
    file: ../../scripts/portalLogouts.js
- tapOn:
    id: 'appbar-avatar'
- tapOn:
    id: 'appbar-logout'
- tapOn:
    id: 'logout-dialog-submit'
- extendedWaitUntil:
    visible:
      id: 'welcome-login'
    timeout: 60000
- runScript:
    file: ../../scripts/portalLogouts.js
    env:
      MORE_THAN: ${output.portalLogouts}
