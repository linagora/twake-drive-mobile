appId: com.linagora.twakedrive
tags:
  - inapp
  - android
env:
  FILE: 'readme.txt'
  FOLDER: 'Documents'
---
# Offline: the app says so, and the writes it cannot carry out are refused
# before they are started — the row menu offers them greyed out rather than
# letting a tap fail. There is no offline queue (see requireOnline).
#
# Airplane mode is an Android-only Maestro command, hence the `android` tag.
# The radio is turned off at the start too: a flow that fails midway is killed
# on the spot and cannot put it back, so the next run clears it rather than
# inheriting it.
#
# The material is what the disposable instance seeds (e2e/stack/setup.sh):
# a `Documents` folder and a `readme.txt` file at the root. Nothing is typed,
# and nothing asserted here is a translated label.
- setAirplaneMode: disabled
- runFlow: ../../subflows/openDrive.yaml
- extendedWaitUntil:
    visible: '${FILE}'
    timeout: 20000
- assertVisible:
    id: 'drive-fab'

- setAirplaneMode: enabled

# The banner names the state, and creating is not offered at all.
- extendedWaitUntil:
    visible:
      id: 'offline-banner'
    timeout: 30000
- assertNotVisible:
    id: 'drive-fab'

# Everything that writes to the stack is out of reach.
- tapOn:
    id: 'file-actions:${FILE}'
- waitForAnimationToEnd
- assertVisible:
    id: 'action-rename'
    enabled: false
- assertVisible:
    id: 'action-delete'
    enabled: false
- assertVisible:
    id: 'action-move'
    enabled: false
- assertVisible:
    id: 'action-share'
    enabled: false
- assertVisible:
    id: 'action-favorite'
    enabled: false
# Keeping a file offline is a download, so it needs the stack as well.
- assertVisible:
    id: 'action-pin'
    enabled: false
# Reading what the replica already holds stays available.
- assertVisible:
    id: 'action-info'
    enabled: true
- back

# Browsing still works: the local replica serves the folder.
- tapOn:
    id: 'folder-row:${FOLDER}'
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    id: 'appbar-back-button'
- waitForAnimationToEnd

- setAirplaneMode: disabled
- extendedWaitUntil:
    visible:
      id: 'drive-fab'
    timeout: 60000
