appId: com.linagora.twakedrive
tags:
  - inapp
  - android
onFlowComplete:
  - runFlow: ../../subflows/cleanup.yaml
---
# Offline, the app says so, offers no create, greys out the writes it cannot
# carry out (there is no offline queue, see requireOnline), and still browses
# the local replica. Airplane mode is Android only; cleanup.yaml turns it off
# again whether the flow passed or not.
- runScript:
    file: ../../scripts/seed.js
    env:
      SEED: '[{"key":"folder","kind":"folder","prefix":"E2E-ro"},{"key":"inner","kind":"file","prefix":"E2E-ro-inner","ext":"txt","parent":"folder"},{"key":"file","kind":"file","prefix":"E2E-ro","ext":"txt"}]'
- runFlow: ../../subflows/openDrive.yaml
- extendedWaitUntil:
    visible:
      id: 'file-row:${output.file.name}'
    timeout: 60000
# the folder's content reaches the replica before the radio goes off
- tapOn:
    id: 'folder-row:${output.folder.name}'
- extendedWaitUntil:
    visible:
      id: 'file-row:${output.inner.name}'
    timeout: 30000
- tapOn:
    id: 'appbar-back-button'
- assertVisible:
    id: 'drive-fab'

- setAirplaneMode: enabled
- extendedWaitUntil:
    visible:
      id: 'offline-banner'
    timeout: 30000
- assertNotVisible:
    id: 'drive-fab'

- tapOn:
    id: 'file-actions:${output.file.name}'
- waitForAnimationToEnd
- assertVisible:
    id: 'action-rename'
    enabled: false
- assertVisible:
    id: 'action-delete'
    enabled: false
- assertVisible:
    id: 'action-share'
    enabled: false
- assertVisible:
    id: 'action-move'
    enabled: false
# the drawer covers the screen: back closes it instead of leaving the app
- pressKey: back
- waitForAnimationToEnd

- tapOn:
    id: 'folder-row:${output.folder.name}'
- extendedWaitUntil:
    visible:
      id: 'file-row:${output.inner.name}'
    timeout: 15000
