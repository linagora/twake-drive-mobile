appId: com.linagora.twakedrive
tags:
  - inapp
  - disposable
env:
  RECIPIENT: 'e2e-recipient@example.org'
  INSIDE: 'Dedans'
onFlowComplete:
  - runFlow: ../../subflows/cleanup.yaml
---
# #391: a folder opened from Partages offers to create inside it.
#
# Tagged `disposable`: once shared by email the folder is a shared drive, and
# nothing in the UI revokes it, so it only runs on the throwaway instance.
- runScript:
    file: ../../scripts/seed.js
    env:
      SEED: '[{"key":"folder","kind":"folder","prefix":"E2E-drive"}]'
- runFlow: ../../subflows/openDrive.yaml
- extendedWaitUntil:
    visible:
      id: 'folder-row:${output.folder.name}'
    timeout: 60000
- tapOn:
    id: "folder-actions:${output.folder.name}${MENU_SUFFIX || ''}"
- waitForAnimationToEnd
- tapOn:
    id: 'action-share'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'share-recipients-title'
    timeout: 20000
- tapOn:
    id: 'share-add-recipient'
- tapOn:
    id: 'share-email-input'
- inputText: '${RECIPIENT}'
- tapOn:
    id: 'share-recipients-title'
- tapOn:
    id: 'share-send'
- extendedWaitUntil:
    visible:
      id: 'recipient-row'
    timeout: 25000
- tapOn:
    id: 'share-close'
- tapOn:
    id: 'tab-shared'
- tapOn:
    id: 'sharings-tab-by-me'
- extendedWaitUntil:
    visible: '${output.folder.name}'
    timeout: 30000
- tapOn: '${output.folder.name}'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'drive-fab'
    timeout: 20000
- tapOn:
    id: 'drive-fab'
- waitForAnimationToEnd
# a drive we own keeps its files on our instance, so the whole menu is
# offered; the recipient side, where it is trimmed, needs a second instance
- tapOn:
    id: 'create-folder'
- tapOn:
    id: 'create-folder-name-input'
- inputText: '${INSIDE}'
- tapOn:
    id: 'create-folder-submit'
- extendedWaitUntil:
    visible: '${INSIDE}'
    timeout: 25000
