appId: com.linagora.twakedrive
tags:
  - inapp
  - android
env:
  CONTENT: 'lu depuis la copie locale'
onFlowComplete:
  - runFlow: ../../subflows/cleanup.yaml
---
# A file kept offline is downloaded, and the viewer reads that copy once the
# radio is off. The badge says so only once the blob has landed.
- runScript:
    file: ../../scripts/seed.js
    env:
      SEED: '[{"key":"file","kind":"file","prefix":"E2E-dl","ext":"txt","content":"lu depuis la copie locale\n"}]'
- runFlow: ../../subflows/openDrive.yaml
- extendedWaitUntil:
    visible:
      id: 'file-row:${output.file.name}'
    timeout: 60000
- tapOn:
    id: 'file-actions:${output.file.name}'
- waitForAnimationToEnd
- tapOn:
    id: 'action-pin'
- extendedWaitUntil:
    visible:
      id: 'pinned-badge:downloaded'
    timeout: 60000

- setAirplaneMode: enabled
- extendedWaitUntil:
    visible:
      id: 'offline-banner'
    timeout: 30000

- tapOn:
    id: 'file-row:${output.file.name}'
- extendedWaitUntil:
    visible: '${CONTENT}'
    timeout: 30000
