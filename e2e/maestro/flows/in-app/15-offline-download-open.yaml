appId: com.linagora.twakedrive
tags:
  - inapp
  - android
env:
  FILE: 'readme.txt'
  CONTENT: 'hello from the e2e stack'
---
# Keeping a file offline downloads it, and the copy is what the viewer reads
# once the radio is off. The badge is the download's own signal: it announces
# "Disponible hors-ligne" only once the blob has landed.
#
# Airplane mode is an Android-only Maestro command, hence the `android` tag.
#
# The file and its content are what the disposable instance seeds
# (e2e/stack/setup.sh). The flow unpins at the end, so a rerun starts clean.
- runFlow: ../../subflows/openDrive.yaml
- extendedWaitUntil:
    visible: '${FILE}'
    timeout: 20000

# Download it for offline use.
- tapOn:
    id: 'file-actions:${FILE}'
- waitForAnimationToEnd
- tapOn:
    id: 'action-pin'
- extendedWaitUntil:
    visible: 'Disponible hors-ligne'
    timeout: 60000

- setAirplaneMode: enabled
- extendedWaitUntil:
    visible:
      id: 'offline-banner'
    timeout: 30000

# The viewer serves the local copy: the seeded content is on screen.
- tapOn:
    id: 'file-row:${FILE}'
- extendedWaitUntil:
    visible: '${CONTENT}'
    timeout: 30000
# The bar steps aside on its own, so the document is touched to bring it back.
- tapOn:
    id: 'document-content'
- waitForAnimationToEnd
- tapOn:
    id: 'document-back-button'
- waitForAnimationToEnd:
    timeout: 8000

- setAirplaneMode: disabled
- extendedWaitUntil:
    visible:
      id: 'drive-fab'
    timeout: 60000

# Leave the file as it was found.
- tapOn:
    id: 'file-actions:${FILE}'
- waitForAnimationToEnd
- tapOn:
    id: 'action-pin'
- extendedWaitUntil:
    notVisible: 'Disponible hors-ligne'
    timeout: 30000
