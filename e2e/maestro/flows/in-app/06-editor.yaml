appId: com.linagora.twakedrive
tags:
  - inapp
  - onlyoffice
env:
  EDITOR_FILE: 'sample.docx'
---
# ⚠️ Tagged `onlyoffice`: the disposable instance has no OnlyOffice server
# behind it, so the CI run leaves this one out. It needs an account whose
# instance serves the editor.
#
# The editors WORK on the current build (observed: the app was on a Docs editor
# at startup). ⚠️ But the "editor loaded" anchor requires a FRESH BUILD with the
# testID `onlyoffice-webview`: the EditorHeader has an EMPTY title and the
# content is a remote WebView (DOM out of Maestro's reach). Also requires an
# accessible ${EDITOR_FILE} fixture (Office file). Shallow smoke: we check that
# the editor WebView mounts (session_code URL resolved) — depends on the backend
# + flagship certification.
- runFlow: ../../subflows/openDrive.yaml
- tapOn: '${EDITOR_FILE}'
- extendedWaitUntil:
    visible:
      id: 'onlyoffice-webview'
    timeout: 20000
