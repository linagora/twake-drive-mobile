appId: com.linagora.twakedrive
tags:
  - inapp
onFlowComplete:
  - runFlow: ../../subflows/cleanup.yaml
---
# Keeping a folder offline downloads what it holds: the file inside carries
# the "available offline" badge. Then the folder is released again.
- runScript:
    file: ../../scripts/seed.js
    env:
      SEED: '[{"key":"folder","kind":"folder","prefix":"E2E-pin"},{"key":"file","kind":"file","prefix":"E2E-pinned","ext":"txt","parent":"folder"}]'
- runFlow: ../../subflows/openDrive.yaml
- extendedWaitUntil:
    visible:
      id: 'folder-row:${output.folder.name}'
    timeout: 60000
- tapOn:
    id: 'folder-actions:${output.folder.name}'
- waitForAnimationToEnd
- tapOn:
    id: 'action-pin'
- waitForAnimationToEnd
- tapOn:
    id: 'folder-row:${output.folder.name}'
- extendedWaitUntil:
    visible: '${output.file.name}'
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: 'pinned-badge:downloaded'
    timeout: 60000
- tapOn:
    id: 'appbar-back-button'
- tapOn:
    id: 'folder-actions:${output.folder.name}'
- waitForAnimationToEnd
- assertVisible:
    id: 'action-unpin'
- tapOn:
    id: 'action-unpin'
- waitForAnimationToEnd
- tapOn:
    id: 'folder-actions:${output.folder.name}'
- waitForAnimationToEnd
- assertVisible:
    id: 'action-pin'
