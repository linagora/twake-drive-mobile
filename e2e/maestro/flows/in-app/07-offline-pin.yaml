appId: com.linagora.twakedrive
tags:
  - inapp
env:
  PIN_TARGET: 'Documents'
---
# Keeps a folder offline and puts it back, on a folder the disposable instance
# seeds rather than one a developer happens to have.
#
# The row's own menu, never `rightOf`: that selector resolves to a neighbour and
# has acted on the wrong row before (see 04-folder-crud). MENU_SUFFIX comes from
# the runner as an expression default, not an `env:` entry, because `-e` does
# not override what a flow declares for itself.
- runFlow: ../../subflows/openDrive.yaml
# Pin
- tapOn:
    id: "folder-actions:${PIN_TARGET}${MENU_SUFFIX || ''}"
- tapOn: 'Garder hors-ligne'
- waitForAnimationToEnd
# The state has toggled: the menu now offers "Retirer du hors-ligne"
- tapOn:
    id: "folder-actions:${PIN_TARGET}${MENU_SUFFIX || ''}"
- extendedWaitUntil:
    visible: 'Retirer du hors-ligne'
    timeout: 10000
# Restore (unpin)
- tapOn: 'Retirer du hors-ligne'
