appId: com.linagora.twakedrive
tags:
  - inapp
onFlowComplete:
  - runFlow: ../../subflows/cleanup.yaml
---
# The share sheet opens for a folder and closes without sharing anything.
- runScript:
    file: ../../scripts/seed.js
    env:
      SEED: '[{"key":"folder","kind":"folder","prefix":"E2E-sheet"}]'
- runFlow: ../../subflows/openDrive.yaml
- extendedWaitUntil:
    visible:
      id: 'folder-row:${output.folder.name}'
    timeout: 60000
- tapOn:
    id: 'folder-actions:${output.folder.name}'
- waitForAnimationToEnd
- tapOn:
    id: 'action-share'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'share-recipients-title'
    timeout: 20000
- assertVisible:
    id: 'share-add-recipient'
- assertVisible: '${output.folder.name}'
- tapOn:
    id: 'share-close'
- extendedWaitUntil:
    visible:
      id: 'folder-row:${output.folder.name}'
    timeout: 15000
