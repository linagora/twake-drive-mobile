appId: com.linagora.twakedrive
tags:
  - inapp
env:
  PREVIEW_FILE: 'sample.jpg'
---
# Opens the image the instance is created with (e2e/stack/setup.sh). Read
# only: nothing here changes it.
- runFlow: ../../subflows/openDrive.yaml
- extendedWaitUntil:
    visible: '${PREVIEW_FILE}'
    timeout: 30000
- tapOn: '${PREVIEW_FILE}'
- extendedWaitUntil:
    visible:
      id: 'preview-image'
    timeout: 20000
