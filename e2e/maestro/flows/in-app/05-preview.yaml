appId: com.linagora.twakedrive
tags:
  - inapp
env:
  PREVIEW_FILE: 'sample.jpg'
---
# Opens the image the disposable instance seeds. The preview is chromeless --
# no text to anchor on -- so it is the image itself that answers, through the
# testID ImagePreview hands to ZoomableImage.
- runFlow: ../../subflows/openDrive.yaml
- tapOn: '${PREVIEW_FILE}'
- extendedWaitUntil:
    visible:
      id: 'preview-image'
    timeout: 10000
