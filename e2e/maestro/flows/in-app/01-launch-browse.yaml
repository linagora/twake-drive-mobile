appId: com.linagora.twakedrive
tags:
  - inapp
onFlowComplete:
  - runFlow: ../../subflows/cleanup.yaml
---
# Opens a folder, sees what it holds, and comes back to the root.
- runScript:
    file: ../../scripts/seed.js
    env:
      SEED: '[{"key":"folder","kind":"folder","prefix":"E2E-browse"},{"key":"file","kind":"file","prefix":"E2E-inside","ext":"txt","parent":"folder"}]'
- runFlow: ../../subflows/openDrive.yaml
- extendedWaitUntil:
    visible:
      id: 'folder-row:${output.folder.name}'
    timeout: 60000
- tapOn:
    id: 'folder-row:${output.folder.name}'
- extendedWaitUntil:
    visible:
      id: 'file-row:${output.file.name}'
    timeout: 30000
- tapOn:
    id: 'appbar-back-button'
- extendedWaitUntil:
    visible:
      id: 'folder-row:${output.folder.name}'
    timeout: 15000
