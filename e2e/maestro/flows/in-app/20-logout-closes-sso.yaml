appId: com.linagora.twakedrive
tags:
  - inapp
# The flows after this one need the session back, whether it passed or not,
# and a replica that has caught up: a flow started during the first sync of a
# fresh sign-in does not see what it seeds in time. Something seeded after the
# sign-in showing up says the sync is past it.
onFlowComplete:
  - runFlow: ../00-login-instance.yaml
  - runScript:
      file: ../../scripts/seed.js
      env:
        SEED: '[{"key":"settled","kind":"folder","prefix":"E2E-settled"}]'
  - extendedWaitUntil:
      visible:
        id: 'folder-row:${output.settled.name}'
      timeout: 180000
  - runFlow: ../../subflows/cleanup.yaml
---
# Signing out opens the page that ends the SSO session in the system browser,
# so the next login asks which account to use. The e2e instance names no SSO
# logout page of its own, so the app falls back to the sign-up portal the
# `signup.url` flag points to, a stand-in here (e2e/stack/portal.js). Like the
# real one it sends the browser back to the app, which closes it: the welcome
# screen is only reachable once the browser is gone.
- runFlow: ../../subflows/openDrive.yaml
- runScript:
    file: ../../scripts/portalLogouts.js
- tapOn:
    id: 'appbar-avatar'
- tapOn:
    id: 'appbar-logout'
- extendedWaitUntil:
    visible:
      id: 'welcome-login'
    timeout: 60000
- runScript:
    file: ../../scripts/portalLogouts.js
    env:
      MORE_THAN: ${output.portalLogouts}
