appId: com.linagora.twakedrive
tags:
  - inapp
env:
  FOLDER_NAME: 'Crud'
onFlowComplete:
  - runFlow:
      file: ../../subflows/cleanup.yaml
      env:
        NAMES: 'Crud'
---
# Creates a folder through the FAB and deletes it through its own row menu.
- runFlow: ../../subflows/openDrive.yaml
- tapOn:
    id: 'drive-fab'
- tapOn: 'Nouveau dossier'
- inputText: '${FOLDER_NAME}'
- pressKey: Enter
- extendedWaitUntil:
    visible: '${FOLDER_NAME}'
    timeout: 15000
- tapOn:
    id: 'folder-actions:${FOLDER_NAME}'
- waitForAnimationToEnd
- tapOn:
    id: 'action-delete'
- waitForAnimationToEnd
- tapOn:
    id: 'confirm-delete-submit'
- extendedWaitUntil:
    notVisible: '${FOLDER_NAME}'
    timeout: 15000
