appId: com.linagora.twakedrive
tags:
  - inapp
env:
  MENU_SUFFIX: ''
onFlowComplete:
  - runFlow: ../../subflows/cleanup.yaml
---
# The menu follows the pin: "Retirer du hors-ligne" once kept offline, "Garder
# hors-ligne" once released. The local purge on unpin is covered by the
# OfflineFilesStore unit test.
- runScript:
    file: ../../scripts/seed.js
    env:
      SEED: '[{"key":"folder","kind":"folder","prefix":"E2E-off"}]'
- runFlow: ../../subflows/openDrive.yaml
- extendedWaitUntil:
    visible:
      id: 'folder-row:${output.folder.name}'
    timeout: 60000
- tapOn:
    id: 'folder-actions:${output.folder.name}${MENU_SUFFIX}'
- waitForAnimationToEnd
- tapOn: 'Garder hors-ligne'
- tapOn:
    id: 'folder-actions:${output.folder.name}${MENU_SUFFIX}'
- waitForAnimationToEnd
- assertVisible: 'Retirer du hors-ligne'
- tapOn: 'Retirer du hors-ligne'
- tapOn:
    id: 'folder-actions:${output.folder.name}${MENU_SUFFIX}'
- waitForAnimationToEnd
- assertVisible: 'Garder hors-ligne'
