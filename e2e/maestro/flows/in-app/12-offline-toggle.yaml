appId: com.linagora.twakedrive
tags:
  - inapp
env:
  MENU_SUFFIX: ''
onFlowComplete:
  - runFlow: ../../subflows/cleanup.yaml
---
# The menu follows the pin: action-unpin once kept offline, action-pin once
# released. The local purge on unpin is covered by the
# OfflineFilesStore unit test.
- runScript:
    file: ../../scripts/seed.js
    env:
      SEED: '[{"key":"folder","kind":"folder","prefix":"E2E-off"}]'
- runFlow: ../../subflows/openDrive.yaml
- extendedWaitUntil:
    visible:
      id: 'folder-row:${output.folder.name}'
    timeout: 60000
- tapOn:
    id: 'folder-actions:${output.folder.name}${MENU_SUFFIX}'
- waitForAnimationToEnd
- tapOn:
    id: 'action-pin'
- tapOn:
    id: 'folder-actions:${output.folder.name}${MENU_SUFFIX}'
- waitForAnimationToEnd
- tapOn:
    id: 'action-unpin'
- tapOn:
    id: 'folder-actions:${output.folder.name}${MENU_SUFFIX}'
- waitForAnimationToEnd
- assertVisible:
    id: 'action-pin'
