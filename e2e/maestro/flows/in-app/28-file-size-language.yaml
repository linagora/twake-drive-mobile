appId: com.linagora.twakedrive
tags:
  - inapp
onFlowComplete:
  - runFlow: ../../subflows/cleanup.yaml
---
# A file size carries the decimal separator of the app language. The seeded
# WAV is 476204 bytes, 465.04 KB.
- runFlow: ../00-set-language-fr.yaml
- runScript:
    file: ../../scripts/seed.js
    env:
      SEED: '[{"key":"file","kind":"file","prefix":"Taille","ext":"wav","silence":true}]'
- runFlow: ../../subflows/openDrive.yaml
- extendedWaitUntil:
    visible: '465,0 Ko.*'
    timeout: 60000
