appId: com.linagora.twakedrive
tags:
  - inapp
env:
  RECIPIENT: 'e2e-recipient@example.org'
onFlowComplete:
  - runFlow: ../../subflows/cleanup.yaml
---
# Shares a folder by email and revokes it. Needs drive.shared-drive.enabled
# and the effective recipients route, both provisioned by e2e/stack/setup.sh.
- runScript:
    file: ../../scripts/seed.js
    env:
      SEED: '[{"key":"folder","kind":"folder","prefix":"E2E-share"}]'
- runFlow: ../../subflows/openDrive.yaml
- extendedWaitUntil:
    visible:
      id: 'folder-row:${output.folder.name}'
    timeout: 60000
- tapOn:
    id: 'folder-actions:${output.folder.name}'
- waitForAnimationToEnd
- tapOn:
    id: 'action-share'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'Lien public'
    timeout: 20000
- tapOn:
    id: 'share-add-recipient'
- tapOn:
    id: 'share-email-input'
- inputText: '${RECIPIENT}'
# a tap outside the field puts the keyboard away from the send button
- tapOn: 'Destinataires'
- tapOn:
    id: 'share-send'
- extendedWaitUntil:
    visible:
      id: 'recipient-row'
    timeout: 25000
- tapOn:
    id: 'remove-recipient'
- extendedWaitUntil:
    notVisible:
      id: 'recipient-row'
    timeout: 25000
- tapOn: 'Fermer'
