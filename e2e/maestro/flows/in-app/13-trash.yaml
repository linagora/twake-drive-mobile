appId: com.linagora.twakedrive
tags:
  - inapp
onFlowComplete:
  - runFlow: ../../subflows/cleanup.yaml
---
# A deleted folder leaves the drive, shows in Corbeille, and is back in the
# drive once restored.
- runScript:
    file: ../../scripts/seed.js
    env:
      SEED: '[{"key":"folder","kind":"folder","prefix":"E2E-trash"}]'
- runFlow: ../../subflows/openDrive.yaml
- extendedWaitUntil:
    visible:
      id: 'folder-row:${output.folder.name}'
    timeout: 60000
- tapOn:
    id: 'folder-actions:${output.folder.name}'
- waitForAnimationToEnd
- tapOn:
    id: 'action-delete'
- waitForAnimationToEnd
- tapOn:
    id: 'confirm-delete-submit'
- extendedWaitUntil:
    notVisible:
      id: 'folder-row:${output.folder.name}'
    timeout: 15000
- tapOn:
    id: 'tab-trash'
- extendedWaitUntil:
    visible: '${output.folder.name}'
    timeout: 30000
- tapOn:
    id: 'folder-actions:${output.folder.name}'
- waitForAnimationToEnd
- tapOn:
    id: 'action-restore'
- extendedWaitUntil:
    notVisible: '${output.folder.name}'
    timeout: 15000
- tapOn:
    id: 'tab-files'
- extendedWaitUntil:
    visible:
      id: 'folder-row:${output.folder.name}'
    timeout: 30000
