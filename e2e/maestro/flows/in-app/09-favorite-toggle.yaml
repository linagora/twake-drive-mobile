appId: com.linagora.twakedrive
tags:
  - inapp
onFlowComplete:
  - runFlow: ../../subflows/cleanup.yaml
---
# A folder added to the favourites shows in Favoris, and leaves it once
# removed.
- runScript:
    file: ../../scripts/seed.js
    env:
      SEED: '[{"key":"folder","kind":"folder","prefix":"E2E-fav"}]'
- runFlow: ../../subflows/openDrive.yaml
- extendedWaitUntil:
    visible:
      id: 'folder-row:${output.folder.name}'
    timeout: 60000
- tapOn:
    id: 'folder-actions:${output.folder.name}'
- waitForAnimationToEnd
- tapOn:
    id: 'action-favorite'
- tapOn:
    id: 'tab-favorites'
- extendedWaitUntil:
    visible: '${output.folder.name}'
    timeout: 30000
- tapOn:
    id: 'folder-actions:${output.folder.name}'
- waitForAnimationToEnd
- tapOn:
    id: 'action-favorite'
- extendedWaitUntil:
    notVisible: '${output.folder.name}'
    timeout: 30000
