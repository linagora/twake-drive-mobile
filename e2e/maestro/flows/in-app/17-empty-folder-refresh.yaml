appId: com.linagora.twakedrive
tags:
  - inapp
onFlowComplete:
  - runFlow: ../../subflows/cleanup.yaml
---
# An empty folder keeps its empty state while the list refetches. The swap to
# the loading state is shorter than an assertion can see, so the window is
# filmed and e2e/scripts/check-recording.mjs checks it frame by frame.
- runScript:
    file: ../../scripts/seed.js
    env:
      SEED: '[{"key":"folder","kind":"folder","prefix":"E2E-empty"}]'
- runFlow: ../../subflows/openDrive.yaml
- extendedWaitUntil:
    visible:
      id: 'folder-row:${output.folder.name}'
    timeout: 60000
- tapOn:
    id: 'folder-row:${output.folder.name}'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'empty-state'
    timeout: 15000
- swipe:
    start: '50%, 35%'
    end: '50%, 75%'
- waitForAnimationToEnd
- startRecording: 17-empty-folder
- repeat:
    times: 30
    commands:
      - assertVisible:
          id: 'empty-state'
      - assertNotVisible:
          id: 'loading-state'
- waitForAnimationToEnd
- stopRecording
# screenrecord finalises the file after stopRecording: the flow must not end
# on it, or the video comes back empty
- waitForAnimationToEnd
- tapOn:
    id: 'appbar-back-button'
- extendedWaitUntil:
    visible:
      id: 'folder-row:${output.folder.name}'
    timeout: 15000
