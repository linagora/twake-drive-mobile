appId: com.linagora.twakedrive
tags:
  - inapp
env:
  FOLDER_NAME: 'E2E-empty'
---
# An empty folder keeps its empty state while the list refetches.
#
# With nothing to list, the empty state is the only thing on screen, so a
# refetch that swaps it for the loading state makes the icon and the text
# blink. A sync landing changes does that on its own; a pull to refresh is the
# same refetch, asked for by hand.
#
# The check is `loading-state` never showing after the first load, repeated
# over several pulls. Measured limit: against a warm local replica the refetch
# is shorter than Maestro's look, so this flow still passed on a build with the
# bug put back. It guards the screen, not the timing; the regression itself is
# pinned by the unit tests.
- runFlow: ../../subflows/openDrive.yaml
- tapOn:
    id: 'drive-fab'
- tapOn: 'Nouveau dossier'
- waitForAnimationToEnd
- inputText: '${FOLDER_NAME}'
- pressKey: Enter
- extendedWaitUntil:
    visible: '${FOLDER_NAME}'
    timeout: 12000
- tapOn: '${FOLDER_NAME}'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'Aucun fichier dans ce dossier'
    timeout: 12000
- repeat:
    times: 3
    commands:
      - swipe:
          start: '50%, 35%'
          end: '50%, 75%'
      - assertNotVisible:
          id: 'loading-state'
      - assertVisible: 'Aucun fichier dans ce dossier'
      - assertNotVisible:
          id: 'loading-state'
      - assertVisible: 'Aucun fichier dans ce dossier'
- waitForAnimationToEnd
- assertVisible: 'Aucun fichier dans ce dossier'
# cleanup: back out and delete the throwaway
- tapOn:
    id: 'appbar-back-button'
- extendedWaitUntil:
    visible: '${FOLDER_NAME}'
    timeout: 12000
- tapOn:
    id: 'folder-actions:${FOLDER_NAME}'
- tapOn: 'Supprimer'
- waitForAnimationToEnd
- tapOn:
    id: 'confirm-delete-submit'
- extendedWaitUntil:
    notVisible: '${FOLDER_NAME}'
    timeout: 15000
