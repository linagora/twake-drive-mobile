appId: com.linagora.twakedrive
---
# Cold-starts the app with its state cleared, on the welcome screen, past what
# a development build or a slow emulator puts in front of it.
- launchApp:
    clearState: true
# A development build: clearing the state also forgot the Metro server, and the
# dev client greets a fresh install with its menu, which covers the app.
- runFlow:
    when:
      visible: 'DEVELOPMENT SERVERS'
    commands:
      - tapOn: "${METRO_URL || 'http://localhost:8081'}"
      - extendedWaitUntil:
          visible: '.*developer menu.*'
          timeout: 120000
      - tapOn: 'Continue'
      - extendedWaitUntil:
          visible: 'Connected to:'
          timeout: 10000
      - tapOn:
          point: '91%,47%'
      - waitForAnimationToEnd
# An emulator under load can raise "isn't responding" over the screen.
- repeat:
    times: 12
    commands:
      - runFlow:
          when:
            visible: 'Wait'
          commands:
            - tapOn: 'Wait'
      - waitForAnimationToEnd:
          timeout: 5000
