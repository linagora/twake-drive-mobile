appId: com.linagora.twakedrive
---
# From the welcome screen to the drive: the development-only "instance address"
# entry point, then the stack's login page answered in the system browser.
# 00-login-instance.yaml runs it on a cleared app; a flow that signs out can run
# it again to come back to what the device kept.
#
# The browser goes first. An emulator without Chrome answers with WebView
# Browser Tester, which keeps the tab of the previous sign-in: handed the new
# authorize page, it loads it, then reloads the old one, whose client the
# logout unregistered ("the client must be registered").
- runFlow:
    when:
      platform: Android
    commands:
      - stopApp: org.chromium.webview_shell
      - stopApp: com.android.chrome
- extendedWaitUntil:
    visible:
      id: 'welcome-dev-instance-link'
    timeout: 120000
- assertVisible:
    id: 'welcome-dev-instance-link'
- tapOn:
    id: 'welcome-dev-instance-link'
# The screen remembers the last address it signed into, the one typed here: a
# signed-out app comes back with it filled in, and typing would append to it.
- runFlow:
    when:
      notVisible: "${INSTANCE_URL || 'http://alice.10-0-2-2.nip.io'}"
    commands:
      - tapOn:
          id: 'dev-instance-uri-input'
      - inputText: "${INSTANCE_URL || 'http://alice.10-0-2-2.nip.io'}"
- tapOn:
    id: 'dev-instance-submit'
# iOS asks before the app may open its authentication session.
- runFlow:
    when:
      visible: '.*(souhaite utiliser|wants to use).*'
    commands:
      - tapOn:
          text: 'Continuer|Continue'
          below: '.*(souhaite utiliser|wants to use).*'
- runFlow:
    when:
      visible: 'Wait'
    commands:
      - tapOn: 'Wait'
# The stack's own login page, in the system browser. On iOS that browser keeps
# the stack's session cookie across runs, and goes straight to the permissions.
- extendedWaitUntil:
    visible: 'Mot de passe|Password|Autoriser.*|Authorize.*'
    timeout: 60000
- runFlow:
    when:
      visible: 'Mot de passe|Password'
    commands:
      - tapOn: 'Mot de passe|Password'
      - inputText: "${INSTANCE_PASSPHRASE || 'cozycozy'}"
      - pressKey: Enter
# The stack's permission page. The e2e stack skips the flagship certification,
# so this is the only thing between the password and the app.
- waitForAnimationToEnd:
    timeout: 10000
- runFlow:
    when:
      visible: 'Autoriser|Authorize'
    commands:
      # The page carries the word three times -- the heading, the bold word
      # inside the paragraph, and the button -- so the tap is anchored under
      # that paragraph. Its English wording is "By electing Authorize, you
      # accept that the application obtains access", with no "you authorize"
      # in it, so the anchor has to name both.
      - tapOn:
          text: 'Autoriser|Authorize'
          below: '.*(vous autorisez|you accept that the application).*'
          retryTapIfNoChange: true
# Back in the app, on the drive.
- extendedWaitUntil:
    visible:
      id: 'drive-fab'
    timeout: 120000
