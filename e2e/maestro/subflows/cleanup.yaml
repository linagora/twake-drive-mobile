appId: com.linagora.twakedrive
---
# Deletes through the stack what the flow seeded, and the root entries it
# created by name (NAMES, comma separated). Meant for onFlowComplete, so it
# runs whether the flow passed or not.
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: disabled
- runScript:
    file: ../scripts/cleanup.js
    env:
      NAMES: "${NAMES || ''}"
